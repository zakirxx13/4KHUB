name: 4KHUB Python Scraper

on:
  workflow_dispatch:

  push:
    branches:
      - master

  schedule:
    - cron: "0 */6 * * *"

jobs:
  scraper:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright selenium

      - name: Install Playwright
        run: |
          python -m playwright install --with-deps chromium

      - name: Check files
        run: |
          echo "Repository:"
          pwd
          ls -la

      - name: Run scraper
        run: |
          python 4khub.py

      - name: Show output
        if: always()
        run: |
          if [ -f output.json ]; then
            echo "========== OUTPUT =========="
            cat output.json
          else
            echo "output.json not found"
          fi

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: scraper-output
          path: output.json
          if-no-files-found: warn
