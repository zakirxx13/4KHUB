name: Python Scraper

on:
  workflow_dispatch:

  push:
    branches:
      - master

  schedule:
    - cron: "0 */6 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Verify files
        run: |
          echo "Current directory:"
          pwd

          echo "Repository files:"
          ls -la

          echo "Scraper directory:"
          ls -la scraper

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Run scraper
        env:
          SOURCE_URL: ${{ secrets.SOURCE_URL }}
        run: |
          python scraper/scraper.py

      - name: Show output
        if: success()
        run: |
          echo "Generated streams.json:"
          cat streams.json

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-output
          path: streams.json
          if-no-files-found: warn
